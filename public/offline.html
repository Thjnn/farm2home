<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#047857">
    <title>Mất kết nối · FARM2HOME</title>
    <style>
        :root {
            --bg: #f0fdf4; --bg2: #ecfccb; --card: #ffffffcc; --ink: #1c1917; --muted: #57534e;
            --brand: #047857; --brand-dark: #065f46; --soft: #d1fae5; --line: #e7e5e4; --warn: #d97706;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0c1a14; --bg2: #14231a; --card: #1c2a22cc; --ink: #f5f5f4; --muted: #a8a29e;
                --brand: #10b981; --brand-dark: #34d399; --soft: #064e3b; --line: #2b3a31; --warn: #fbbf24;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 1rem;
            background: radial-gradient(120% 80% at 50% 0%, var(--bg2), var(--bg) 60%);
            color: var(--ink); font-family: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
            overflow-x: hidden;
        }
        main {
            position: relative; width: 100%; max-width: 24rem; padding: 2rem 1.5rem 1.5rem; text-align: center;
            background: var(--card); border: 1px solid var(--line); border-radius: 1.75rem;
            box-shadow: 0 20px 50px -20px rgb(4 120 87 / .35); backdrop-filter: blur(8px);
            animation: rise .6s cubic-bezier(.2, .8, .2, 1) both;
        }
        .art { width: 11rem; height: 11rem; margin: -0.5rem auto 0.5rem; display: block; }
        .bob { animation: bob 3.2s ease-in-out infinite; transform-origin: 50% 80%; }
        .wave { animation: blink 1.6s ease-in-out infinite; }
        .wave.w2 { animation-delay: .2s; } .wave.w3 { animation-delay: .4s; }
        .leaf { position: absolute; width: 1.4rem; opacity: .55; animation: drift 7s ease-in-out infinite; pointer-events: none; }
        .leaf.l1 { top: 1rem; left: 1.25rem; }
        .leaf.l2 { top: 4.5rem; right: 1.25rem; animation-delay: -2.5s; transform: scale(.8); }
        .brand { font-weight: 800; letter-spacing: .08em; font-size: .75rem; color: var(--brand); }
        h1 { font-size: 1.5rem; line-height: 1.25; margin: .35rem 0 .5rem; }
        p { margin: 0; line-height: 1.6; color: var(--muted); }
        .status {
            display: inline-flex; align-items: center; gap: .5rem; margin: 1rem 0 1.25rem; padding: .4rem .85rem;
            border-radius: 999px; font-size: .85rem; font-weight: 600; background: var(--soft); color: var(--brand-dark);
        }
        .status::before { content: ''; width: .5rem; height: .5rem; border-radius: 50%; background: var(--warn); animation: pulse 1.4s ease-in-out infinite; }
        .status.ok::before { background: var(--brand); }
        ul { list-style: none; margin: 0 0 1.5rem; padding: 0; text-align: left; display: grid; gap: .5rem; }
        li { display: flex; gap: .75rem; align-items: center; padding: .7rem .85rem; border: 1px solid var(--line); border-radius: .9rem; font-size: .92rem; }
        li span { flex: none; display: grid; place-items: center; width: 2rem; height: 2rem; border-radius: .6rem; background: var(--soft); font-size: 1rem; }
        button {
            width: 100%; min-height: 3.25rem; border: 0; border-radius: 1rem; cursor: pointer;
            background: linear-gradient(135deg, #059669, #047857); color: #fff; font: inherit; font-size: 1.05rem; font-weight: 700;
            box-shadow: 0 10px 24px -10px rgb(4 120 87 / .7); transition: transform .15s, box-shadow .15s;
            display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
        }
        button:hover { transform: translateY(-1px); box-shadow: 0 14px 28px -10px rgb(4 120 87 / .8); }
        button:active { transform: translateY(1px) scale(.99); }
        button:focus-visible { outline: 3px solid var(--brand-dark); outline-offset: 3px; }
        button svg { width: 1.2rem; height: 1.2rem; }
        button.spin svg { animation: spin .8s linear infinite; }

        @keyframes rise { from { opacity: 0; transform: translateY(16px) scale(.98); } }
        @keyframes bob { 50% { transform: translateY(-6px) rotate(-2deg); } }
        @keyframes blink { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
        @keyframes drift { 50% { transform: translate(6px, 10px) rotate(25deg); } }
        @keyframes pulse { 50% { transform: scale(1.5); opacity: .5; } }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
    </style>
</head>
<body>
    <main>
        <svg class="leaf l1" viewBox="0 0 24 24" aria-hidden="true"><path fill="#10b981" d="M5 19C5 9 12 4 21 3c-1 9-6 16-16 16zm0 0 8-8"/></svg>
        <svg class="leaf l2" viewBox="0 0 24 24" aria-hidden="true"><path fill="#84cc16" d="M5 19C5 9 12 4 21 3c-1 9-6 16-16 16zm0 0 8-8"/></svg>

        <svg class="art" viewBox="0 0 200 200" aria-hidden="true">
            <ellipse cx="100" cy="178" rx="58" ry="8" fill="#047857" opacity=".12"/>
            <g class="bob">
                <!-- leaves sticking out of the basket -->
                <path d="M70 112c-14-22-8-46 8-58 6 20 4 40-8 58z" fill="#22c55e"/>
                <path d="M96 108c-4-30 10-50 28-56-2 24-10 42-28 56z" fill="#16a34a"/>
                <path d="M120 112c4-22 22-34 40-32-8 18-22 30-40 32z" fill="#84cc16"/>
                <path d="M84 110c-18-12-34-10-44-2 16 8 30 8 44 2z" fill="#4ade80"/>
                <!-- basket -->
                <path d="M44 106h112l-12 58a10 10 0 0 1-10 8H66a10 10 0 0 1-10-8z" fill="#d97706"/>
                <path d="M40 100h120a6 6 0 0 1 0 12H40a6 6 0 0 1 0-12z" fill="#b45309"/>
                <path d="M62 124h76M66 142h68M70 158h60" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" opacity=".6"/>
                <path d="M84 112v52M100 112v54M116 112v52" stroke="#92400e" stroke-width="3" opacity=".35"/>
            </g>
            <!-- wifi with a slash -->
            <g transform="translate(150 34)" fill="none" stroke-linecap="round">
                <circle r="26" fill="#fff" stroke="#e7e5e4" stroke-width="2"/>
                <path class="wave w3" d="M-15-2a21 21 0 0 1 30 0" stroke="#047857" stroke-width="4"/>
                <path class="wave w2" d="M-9 5a12 12 0 0 1 18 0" stroke="#047857" stroke-width="4"/>
                <circle class="wave" cy="12" r="3" fill="#047857" stroke="none"/>
                <path d="M-16-16 16 16" stroke="#dc2626" stroke-width="4"/>
            </g>
        </svg>

        <div class="brand">FARM2HOME</div>
        <h1>Ối, mất mạng rồi!</h1>
        <p>Rau vẫn đang chờ bạn. Điện thoại tạm thời chưa vào được Internet.</p>

        <div class="status" id="status" role="status" aria-live="polite">Đang chờ kết nối lại…</div>

        <ul>
            <li><span>📶</span>Kiểm tra wifi hoặc bật 4G</li>
            <li><span>✈️</span>Tắt chế độ máy bay nếu đang bật</li>
            <li><span>🔄</span>Có mạng lại, trang sẽ tự tải</li>
        </ul>

        <button type="button" id="retry">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
            Thử lại
        </button>
    </main>

    <script>
        const retry = document.getElementById('retry');
        const status = document.getElementById('status');
        const reload = () => { retry.classList.add('spin'); setTimeout(() => location.reload(), 300); };
        retry.addEventListener('click', reload);
        window.addEventListener('online', () => {
            status.classList.add('ok');
            status.textContent = 'Đã có mạng, đang tải lại…';
            reload();
        });
    </script>
</body>
</html>
